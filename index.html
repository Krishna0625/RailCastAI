<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress spurious unhandled rejections/errors caused by browser extensions (e.g. MetaMask, Web3 wallets)
      (function() {
        function isExtensionError(msg, src) {
          var str = ((msg || '') + ' ' + (src || '')).toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('ethereum') !== -1 ||
            str.indexOf('web3') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('evm') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (!event) return;
          var reason = event.reason;
          var reasonMsg = (reason && (reason.message || reason.toString())) || '';
          var reasonStack = (reason && reason.stack) || '';
          if (isExtensionError(reasonMsg, reasonStack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (!event) return;
          var msg = event.message || '';
          var src = event.filename || '';
          if (isExtensionError(msg, src)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>RailCast AI — Dynamic & Explainable ETA Intelligence | Indian Railways</title>
